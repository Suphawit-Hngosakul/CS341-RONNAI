AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CS341-RONNAI data lake (Issue #2): S3 zones, Glue databases, Athena workgroup.
  Designed for AWS Academy Learner Lab (no IAM resources are created; services
  run with the pre-existing LabRole).

Parameters:
  ProjectName:
    Type: String
    Default: ronnai
    AllowedPattern: "^[a-z][a-z0-9]{2,19}$"
    Description: Prefix used in resource names (lowercase letters and digits only, so Glue/Athena names stay valid).

  BytesScannedCutoffPerQuery:
    Type: Number
    Default: 1073741824
    MinValue: 10485760
    Description: >-
      Athena per-query scan limit in bytes (default 1 GB, minimum 10 MB).
      A query that scans more than this is cancelled.

  AthenaResultsRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: Days before old Athena query results are deleted automatically.

  TeammateAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional. 12-digit AWS account IDs of teammates' Learner Labs, comma separated.
      Their LabRole gets read/write on this bucket. Leave empty to skip.

Conditions:
  HasTeammates: !Not [!Equals [!Join ["", !Ref TeammateAccountIds], ""]]

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-datalake-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: !Ref AthenaResultsRetentionDays
          - Id: expire-incoming
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: issue
          Value: "2"

  TeammateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasTeammates
    Properties:
      Bucket: !Ref DataLakeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TeammatesReadWrite
            Effect: Allow
            Principal:
              AWS: !Split
                - ","
                - !Sub
                  - "arn:aws:iam::${ids}:role/LabRole"
                  - ids: !Join [":role/LabRole,arn:aws:iam::", !Ref TeammateAccountIds]
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt DataLakeBucket.Arn
              - !Sub "${DataLakeBucket.Arn}/*"

  TrustedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_trusted"
        Description: Validated data (Parquet) from the trusted/ zone.
        LocationUri: !Sub "s3://${DataLakeBucket}/trusted/"

  CuratedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_curated"
        Description: Analysis-ready Apache Iceberg tables in the curated/ zone.
        LocationUri: !Sub "s3://${DataLakeBucket}/curated/"

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-wg"
      Description: CS341-RONNAI workgroup with per-query scan limit.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !Ref BytesScannedCutoffPerQuery
        EngineVersion:
          SelectedEngineVersion: "Athena engine version 3"
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataLakeBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: project
          Value: !Ref ProjectName

Outputs:
  Region:
    Value: !Ref AWS::Region
  BucketName:
    Value: !Ref DataLakeBucket
  TrustedDatabaseName:
    Value: !Ref TrustedDatabase
  CuratedDatabaseName:
    Value: !Ref CuratedDatabase
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  AthenaResultsLocation:
    Value: !Sub "s3://${DataLakeBucket}/athena-results/"
