# Data contract: LST (Issue #8) — ผลิตโดย gee/ronnai_community_zonal.js (Issue #4)
# ระดับกฎ: BLOCK = ไม่ผ่าน ส่งแถว/batch ไป quarantine | STANDARDIZE = แก้แล้วผ่าน | WARN = ผ่านแต่ log
source: lst
version: 1
description: LST ต่อชุมชน x buffer x ปี (Landsat 8+9 C2 L2, 1 มี.ค.-31 พ.ค., median composite)
format: csv
encoding: utf-8            # ไม่มี BOM
key: [community_id, buffer_m, year]
master_list:
  path: gee/communities.csv
  column: community_id

standardize:               # ทำก่อนตรวจกฎ
  - strip_bom_from_header
  - trim_whitespace
  - cast_types

table_checks:
  - {rule: required_columns,  level: BLOCK}
  - {rule: row_count_min,     value: 1, level: BLOCK}
  - {rule: unique_key,        level: BLOCK}

columns:
  - name: community_id
    type: string
    nullable: false
    checks:
      - {rule: in_master_list, level: BLOCK}
  - name: buffer_m
    type: int
    unit: m
    nullable: false
    checks:
      - {rule: allowed_values, values: [300, 500], level: BLOCK}
  - name: year
    type: int
    nullable: false
  - name: lst_mean
    type: float
    unit: degC
    nullable: false
    checks:
      - {rule: range, min: 15, max: 70, level: BLOCK}
  - name: lst_p90
    type: float
    unit: degC
    nullable: false
    checks:
      - {rule: range, min: 15, max: 70, level: BLOCK}
  - name: valid_pixel_ratio
    type: float
    unit: ratio
    nullable: false
    checks:
      - {rule: range, min: 0, max: 1, level: BLOCK}
      - {rule: min,   value: 0.3, level: WARN}     # < 0.3 = เมฆบังมาก
  - name: n_scenes
    type: int
    unit: scenes
    nullable: false
    checks:
      - {rule: min, value: 0, level: BLOCK}
