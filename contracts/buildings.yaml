# Data contract: อาคาร (Issue #8) — ผลิตโดย gee/ronnai_community_zonal.js (Issue #6)
# ระดับกฎ: BLOCK = ไม่ผ่าน ส่งแถว/batch ไป quarantine | STANDARDIZE = แก้แล้วผ่าน | WARN = ผ่านแต่ log
source: buildings
version: 1
description: ความหนาแน่นอาคารต่อชุมชน x buffer (Google Open Buildings v3 ความเชื่อมั่น >= 0.7) ข้อมูลอาคารคงที่ year คือปีวิเคราะห์
format: csv
encoding: utf-8            # ไม่มี BOM
key: [community_id, buffer_m, year]
master_list:
  path: gee/communities.csv
  column: community_id

standardize:
  - strip_bom_from_header
  - trim_whitespace
  - cast_types

table_checks:
  - {rule: required_columns,  level: BLOCK}
  - {rule: row_count_min,     value: 1, level: BLOCK}
  - {rule: unique_key,        level: BLOCK}

columns:
  - name: community_id
    type: string
    nullable: false
    checks:
      - {rule: in_master_list, level: BLOCK}
  - name: buffer_m
    type: int
    unit: m
    nullable: false
    checks:
      - {rule: allowed_values, values: [300, 500], level: BLOCK}
  - name: year
    type: int
    nullable: false
  - name: builtup_pct
    type: float
    unit: percent
    nullable: false
    checks:
      - {rule: range, min: 0, max: 100, level: BLOCK}
  - name: building_count
    type: int
    unit: buildings
    nullable: true               # ว่างได้ถ้าตั้ง COMPUTE_BUILDING_COUNT = false ใน GEE
    checks:
      - {rule: min,       value: 0, level: BLOCK}
      - {rule: not_equal, value: 0, level: WARN}   # 0 = ไม่มีอาคาร หรือข้อมูลไม่ครอบคลุม
      - {rule: not_null,  level: WARN}
