# คัดลอกเป็น config/settings.yaml แล้วแก้ค่า (ไฟล์จริงถูก .gitignore ไว้)
# หรือรัน infra/ronnai_aws.ps1 -Action setup (หรือ .sh) ซึ่งจะสร้าง settings.yaml ให้อัตโนมัติ
# ห้ามใส่ access key / secret ในไฟล์นี้
aws:
  region: us-east-1               # AWS Academy Learner Lab ใช้ us-east-1
  profile: default                # ชื่อ AWS CLI profile (ไม่ใช่ key)
s3:
  bucket: cs341-ronnai-477710504722   # สคริปต์ setup ตั้งชื่อนี้ให้ (account_id = เลข AWS account)
  prefixes:
    incoming: incoming/
    raw: raw/
    trusted: trusted/
    curated: curated/
    quarantine: quarantine/
    athena_results: athena-results/
glue:
  databases:
    trusted: ronnai_trusted
    curated: ronnai_curated
athena:
  workgroup: ronnai-wg
  scan_limit_mb: 1024             # จำกัดข้อมูลที่สแกนต่อ query (ตั้งใน workgroup)
