# คัดลอกเป็น config/settings.yaml แล้วแก้ค่า (ไฟล์จริงถูก .gitignore ไว้)
# ห้ามใส่ access key / secret ในไฟล์นี้
aws:
  region: us-east-1               # Learner Lab ใช้ us-east-1
  profile: default                # ชื่อ AWS CLI profile (ไม่ใช่ key)
s3:
  bucket: ronnai-datalake-<account-id>-us-east-1   # infra deploy เขียนค่าจริงให้
  prefixes:
    incoming: incoming/
    raw: raw/
    trusted: trusted/
    curated: curated/
    quarantine: quarantine/
    athena_results: athena-results/
glue:
  databases:
    trusted: ronnai_trusted
    curated: ronnai_curated
athena:
  workgroup: ronnai-wg
